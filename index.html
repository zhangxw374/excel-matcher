<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>利鑫物流 · Excel 核对工具</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --brand:#0d5344; --brand-2:#16634d; --brand-3:#1f8a6c; --brand-soft:#e8f3ef;
  --gold:#c9a961;
  --bg:#f7f6f3; --panel:#fff; --panel-2:#fbfbfa;
  --line:#e5e3dd; --line-2:#efede7;
  --ink:#1a1a1a; --ink-2:#6b6b66; --ink-3:#96938b;
  --good:#2e7d32; --bad:#c62828; --warn:#e65100;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 2px 8px rgba(0,0,0,.04);
  --mono:"SF Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}

.brand-bar{background:linear-gradient(135deg,#0a4a3d,#0d5344 45%,#16634d);
  color:#fff;border-bottom:3px solid var(--gold);position:relative;overflow:hidden}
.brand-bar::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;
  border-radius:50%;background:radial-gradient(circle,rgba(201,169,97,.15),transparent 70%);pointer-events:none}
.brand-inner{max-width:1200px;margin:0 auto;padding:20px 32px;display:flex;align-items:center;gap:18px}
.brand-logo{width:56px;height:56px;border-radius:12px;
  background:linear-gradient(135deg,#c9a961,#a88a4a);display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:#0d5344;font-family:serif;
  box-shadow:0 4px 12px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.3);flex-shrink:0}
.brand-text{flex:1;min-width:0}
.brand-company{font-size:13px;color:var(--gold);letter-spacing:.15em;font-weight:600;margin-bottom:2px}
.brand-title{font-size:22px;font-weight:700;color:#fff;line-height:1.2}
.brand-sub{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:3px}

main{max-width:1200px;margin:0 auto;padding:24px 32px 80px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:22px 26px;margin-bottom:18px;box-shadow:var(--shadow)}
.card-title{margin:0 0 16px;font-size:15px;font-weight:700;color:var(--ink);
  display:flex;align-items:center;gap:10px}
.card-title .num{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand-2);
  font-size:12px;font-weight:700;flex-shrink:0}
.card-title .sub{color:var(--ink-3);font-weight:400;font-size:12.5px;margin-left:4px}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode-card{border:2px solid var(--line);border-radius:10px;padding:18px 20px;
  cursor:pointer;transition:all .18s;background:#fff;position:relative}
.mode-card:hover{border-color:#c9c6be;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.mode-card.active{border-color:var(--brand-2);background:linear-gradient(135deg,#e8f3ef,#f0f8f5)}
.mode-card.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--brand-2);border-radius:10px 0 0 10px}
.mode-card input{display:none}
.mode-name{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px}
.mode-card.active .mode-name{color:var(--brand)}
.mode-desc{font-size:12.5px;color:var(--ink-2);line-height:1.55}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px}
.grid-2 .full{grid-column:1/-1}
label.field{display:block;font-size:13px;color:var(--ink);font-weight:500}
label.field .hint{display:block;color:var(--ink-3);font-size:12px;font-weight:400;margin-top:2px}
input[type=file],input[type=text],input[type=number],select{
  width:100%;margin-top:6px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;
  font:inherit;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input[type=number]:focus,select:focus{
  outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(22,99,77,.1)}
input[type=file]{padding:7px 10px;cursor:pointer}
input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.row-inline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cb-line{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.cb-line input{width:auto;margin:0;accent-color:var(--brand-2)}

button{font-family:inherit;cursor:pointer;transition:all .15s}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:11px 28px;
  font-size:14.5px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));border:none;border-radius:8px;
  box-shadow:0 2px 6px rgba(13,83,68,.25)}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,var(--brand-2),var(--brand-3));
  box-shadow:0 4px 12px rgba(13,83,68,.32);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;
  font-size:14px;font-weight:600;color:var(--brand-2);background:#fff;
  border:1.5px solid var(--brand-2);border-radius:8px}
.btn-ghost:hover:not(:disabled){background:var(--brand-soft)}
.btn-ghost:disabled{opacity:.45;cursor:not-allowed}
.btn-mini{padding:2px 10px;font-size:11.5px;color:var(--ink-2);
  background:#fff;border:1px solid var(--line);border-radius:5px}
.btn-mini:hover{border-color:var(--brand-2);color:var(--brand-2)}
.btn-link{color:var(--brand-2);text-decoration:none;font-size:12.5px;font-weight:500}
.btn-link:hover{color:var(--brand);text-decoration:underline}

.sheet-card{border:1px solid var(--line);border-radius:9px;
  padding:14px 16px;margin-bottom:10px;background:var(--panel-2)}
.sheet-card.off{opacity:.55}
.sheet-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sheet-head input[type=number]{width:90px;margin-top:0;padding:5px 8px}
.sheet-head .sh-count{font-size:12px;color:var(--ink-3);margin-left:auto;font-weight:500}
.sheet-name{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.sheet-name::before{content:"";display:inline-block;width:4px;height:14px;background:var(--brand-2);border-radius:2px}
.col-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.col-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:#fff;border-radius:6px;padding:5px 10px;font-size:12.5px;cursor:pointer;
  max-width:240px;transition:all .15s;user-select:none}
.col-chip:hover{border-color:#c9c6be}
.col-chip.on{border-color:var(--brand-2);background:var(--brand-soft);color:var(--brand)}
.col-chip input{width:auto;margin:0;accent-color:var(--brand-2)}
.col-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-hint{font-size:12.5px;color:var(--ink-3);font-style:italic}
.warn-text{color:var(--warn);font-weight:500}

.cfg-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px 14px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.cfg-row .lbl{font-size:12.5px;color:var(--ink-2);font-weight:600;min-width:70px;letter-spacing:.02em}
.cfg-row select{width:auto;min-width:220px;margin:0;padding:6px 10px;font-size:13px}

.interval-item{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 14px;border-radius:8px;margin-top:7px;background:#fff;border:1px solid var(--line)}
.interval-item.on{border-color:var(--brand-2);background:linear-gradient(135deg,#f0f8f5,#fff)}
.interval-item .iv-head{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;min-width:240px}
.interval-item .iv-head input{accent-color:var(--brand-2)}
.interval-item .iv-head span{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.interval-item .iv-edit{display:flex;align-items:center;gap:6px;margin-left:auto;
  font-size:12.5px;color:var(--ink-2);font-family:var(--mono)}
.interval-item .iv-edit input[type=text]{width:72px;padding:4px 8px;margin:0;text-align:center;
  font-size:12.5px;font-family:var(--mono)}
.iv-status{font-weight:700;font-size:14px;margin-left:4px}
.iv-status.ok{color:var(--good)}
.iv-status.bad{color:var(--bad)}

#stats{display:none;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
#stats.on{display:grid}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:16px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--brand-2);opacity:.25}
.stat.good::before{background:var(--good);opacity:.6}
.stat.bad::before{background:var(--bad);opacity:.6}
.stat.warn::before{background:var(--warn);opacity:.6}
.stat .num{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.good .num{color:var(--good)}
.stat.bad .num{color:var(--bad)}
.stat.warn .num{color:var(--warn)}
.stat .cap{font-size:12.5px;color:var(--ink-2);margin-top:4px}

#summary-wrap{display:none}
#summary-wrap.on{display:block}
.tbl-tools{display:flex;gap:12px;align-items:center;margin:8px 0 12px;flex-wrap:wrap}
.tbl-tools input{flex:0 1 300px;margin-top:0;padding:7px 12px}
.tbl-tools .count{color:var(--ink-2);font-size:12.5px;margin-left:auto}
.table-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:9px}
table.sum{border-collapse:collapse;width:100%;font-size:13px}
table.sum th,table.sum td{border-bottom:1px solid var(--line-2);padding:9px 12px;
  text-align:left;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
table.sum thead th{position:sticky;top:0;background:linear-gradient(180deg,#f5f4f0,#efede7);
  z-index:1;font-size:12px;color:var(--ink-2);font-weight:700;cursor:pointer;user-select:none;letter-spacing:.03em}
table.sum thead th:hover{color:var(--brand-2)}
table.sum tbody tr:hover{background:var(--brand-soft)}
table.sum td.id{font-family:var(--mono);font-size:12.5px}
table.sum td.c{text-align:right;font-variant-numeric:tabular-nums}
tr.row-good{background:#f4faf5}
tr.row-bad{background:#fdf3f3}
tr.row-warn{background:#fffaf0}
tr.row-good:hover{background:#e8f5e9}
tr.row-bad:hover{background:#fce4e4}
tr.row-warn:hover{background:#ffefd5}
td.status-good{color:var(--good);font-weight:700}
td.status-bad{color:var(--bad);font-weight:700}
td.status-warn{color:var(--warn);font-weight:700}

#log{background:#0f1512;color:#d7dbd6;border-radius:9px;padding:14px 18px;
  max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
  font-family:var(--mono);font-size:12.5px;line-height:1.65}
#log .t{color:#6e7a70;user-select:none}
#log b{color:#7dd3a7}

#legend{font-size:12.5px;line-height:2}
.legend-item{display:inline-flex;align-items:center;margin:2px 14px 2px 0;
  font-family:var(--mono);font-size:12px}
.legend-swatch{display:inline-block;width:15px;height:15px;
  border:1px solid rgba(0,0,0,.18);margin-right:6px;border-radius:3px}

#downloads a{display:inline-flex;align-items:center;gap:8px;margin:8px 10px 0 0;
  padding:11px 22px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;text-decoration:none;border-radius:8px;font-size:14px;font-weight:600;
  box-shadow:0 2px 6px rgba(13,83,68,.2);transition:all .15s}
#downloads a:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(13,83,68,.3)}

.note{background:linear-gradient(135deg,#fdf9ee,#fdf6e3);border:1px solid #ede0b8;
  border-left:3px solid var(--gold);border-radius:7px;padding:10px 14px;
  font-size:12.5px;color:#6a5d21;line-height:1.65}
.note b{color:#5a4d17}

@media (max-width:780px){
  .brand-inner{padding:16px 20px}
  .brand-title{font-size:18px}
  main{padding:18px 16px 60px}
  .card{padding:16px 18px}
  .grid-2,.mode-grid{grid-template-columns:1fr}
  #stats.on{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header class="brand-bar">
  <div class="brand-inner">
    <div class="brand-logo">鑫</div>
    <div class="brand-text">
      <div class="brand-company">SHENZHEN LIXIN LOGISTICS</div>
      <div class="brand-title">深圳市利鑫物流有限公司</div>
      <div class="brand-sub">Excel 数据核对工具 · 集合匹配 / 查值核对·填充</div>
    </div>
  </div>
</header>

<main>

<section class="card">
  <h2 class="card-title"><span class="num">1</span>选择处理模式</h2>
  <div class="mode-grid" id="modeGrid">
    <label class="mode-card active" data-mode="set">
      <input type="radio" name="mode" value="set" checked>
      <div class="mode-name">集合匹配</div>
      <div class="mode-desc">两张表各选一列或多列，找出值相同的记录。适合指令号、订单号等标识的交叉比对。</div>
    </label>
    <label class="mode-card" data-mode="lookup">
      <input type="radio" name="mode" value="lookup">
      <div class="mode-name">查值核对 / 填充</div>
      <div class="mode-desc">用「键」在矩阵表或规则表里定位一条记录：<b>填充</b>把取到的值写入明细表；<b>核对</b>与明细表现有值比对。</div>
    </label>
  </div>
</section>

<section class="card">
  <h2 class="card-title"><span class="num">2</span>选择文件并读取</h2>
  <div class="grid-2">
    <label class="field">文件 A（主表 / 左侧表）
      <input type="file" id="fileA" accept=".xlsx,.xls">
      <span class="hint" id="hintA">可多 Sheet，支持 .xlsx / .xls</span>
    </label>
    <label class="field">文件 B（明细表 / 右侧表）
      <input type="file" id="fileB" accept=".xlsx,.xls">
      <span class="hint" id="hintB">可多 Sheet，支持 .xlsx / .xls</span>
    </label>
  </div>
  <div style="margin-top:16px">
    <button class="btn-ghost" id="readBtn" onclick="readFiles()">读取文件并解析</button>
    <span class="empty-hint" style="margin-left:12px">读取完成后请在下方配置 Sheet、表头行与列。</span>
  </div>
</section>

<div id="configPanel"></div>

<section class="card" id="settingsPanel" style="display:none">
  <h2 class="card-title"><span class="num">4</span>处理与导出设置</h2>

  <div class="grid-2" id="settingsSet">
    <label class="field">高亮颜色模式
      <select id="colorMode">
        <option value="multi">每个匹配键不同颜色</option>
        <option value="uniform">全部匹配统一颜色</option>
      </select>
    </label>
    <label class="field row-inline" id="uniformColorRow" style="display:none">
      统一填充色：<input type="color" id="uniformColor" value="#ffe08a">
    </label>
  </div>

  <div class="grid-2" id="settingsLookup" style="display:none">
    <label class="field full">操作类型
      <select id="actionMode">
        <option value="fill">填充：把主表取到的值写入明细表的目标列（会覆盖该列现有值）</option>
        <option value="check">核对：读明细表现有值，与主表值比对是否一致</option>
      </select>
    </label>
    <label class="field">数值比较容差（仅核对模式使用）
      <input type="number" id="tolerance" value="0.01" step="0.0001" min="0">
      <span class="hint">两边数值差在此范围内视为一致。</span>
    </label>
    <label class="field">核对异常处理（仅核对模式使用）
      <select id="onMiss">
        <option value="mark">标黄高亮</option>
        <option value="skip">跳过不高亮</option>
      </select>
    </label>
  </div>

  <div class="note" style="margin-top:14px">
    导出时固定：① 追加「核对汇总」Sheet；② 清除原文件中的条件格式（避免旧规则与本次高亮叠加）。
  </div>
  <div style="margin-top:16px">
    <button class="btn-primary" id="runBtn" onclick="process()" disabled>开始处理</button>
  </div>
</section>

<div id="stats"></div>

<section class="card" id="summary-wrap">
  <h2 class="card-title"><span class="num">5</span>结果总览<span class="sub">点列头排序</span></h2>
  <div class="tbl-tools">
    <input type="text" id="sumFilter" placeholder="按关键字筛选…" oninput="renderSummaryTable()">
    <a href="#" id="csvMain" class="btn-link">下载 主清单 CSV</a>
    <a href="#" id="csvOnlyA" class="btn-link">下载 仅A CSV</a>
    <a href="#" id="csvOnlyB" class="btn-link">下载 仅B CSV</a>
    <span class="count" id="sumCount"></span>
  </div>
  <div class="table-scroll">
    <table class="sum">
      <thead id="sumHead"></thead>
      <tbody id="sumBody"></tbody>
    </table>
  </div>
</section>

<section class="card" id="legend-panel" style="display:none">
  <h2 class="card-title"><span class="num">6</span>颜色图例</h2>
  <div id="legend"></div>
</section>

<section class="card" id="dl-panel" style="display:none">
  <h2 class="card-title"><span class="num">7</span>下载结果</h2>
  <div id="downloads"></div>
  <div class="note" id="dlNote" style="margin-top:12px"></div>
</section>

<section class="card">
  <h2 class="card-title"><span class="num">8</span>处理日志</h2>
  <div id="log"></div>
</section>

</main>

<script>
/* ==================================================================
   一、核心工具
   ================================================================== */
function getCellText(cell){
  if(!cell)return '';
  const v=cell.value;
  if(v===null||v===undefined)return '';
  if(v instanceof Date){
    const y=v.getFullYear(),m=String(v.getMonth()+1).padStart(2,'0'),d=String(v.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+d;
  }
  if(typeof v==='number')return String(v);
  if(typeof v==='object'){
    if(v.richText)return v.richText.map(t=>t.text).join('');
    if(v.text!==undefined)return String(v.text);
    if(v.result!==undefined&&v.result!==null)return String(v.result);
    return String(v);
  }
  return String(v);
}

const INVISIBLES=/[\s\u00AD\u200B-\u200F\u2060\uFEFF\u180E\u0009-\u000D\u0085\u2028\u2029]/g;
const FULLWIDTH=/[！-～]/g;
const DASHES=/[‐‑‒–—―−─━⁃﹘﹣－゠ー︱︲]/g;
const QUOTES=/[“”«»]/g;
const APOSTROPHES=/[‘’‛`´]/g;
function normalize(raw){
  if(raw===null||raw===undefined)return '';
  return String(raw)
    .replace(INVISIBLES,'')
    .replace(FULLWIDTH,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(DASHES,'-').replace(QUOTES,'"').replace(APOSTROPHES,"'")
    .toUpperCase();
}
function extractNumber(raw){
  if(raw===null||raw===undefined)return null;
  if(typeof raw==='number')return isFinite(raw)?raw:null;
  const s=String(raw).replace(/,/g,'').trim();
  if(!s)return null;
  const m=s.match(/-?\d+(?:\.\d+)?/);
  if(!m)return null;
  const n=parseFloat(m[0]);
  return isFinite(n)?n:null;
}
function parseInterval(text){
  const raw=String(text||'').trim();
  if(!raw)return {min:null,max:null,valid:false,raw,note:'空'};
  const nums=(raw.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  const hasAbove=/以上|及以上|起|不小于|≥|>=|>|＞/.test(raw);
  const hasBelow=/以下|及以下|以内|不超过|不大于|≤|<=|＜|低于/.test(raw);
  if(nums.length>=2){
    const lo=Math.min(nums[0],nums[1]),hi=Math.max(nums[0],nums[1]);
    return {min:lo,max:hi,valid:true,raw,note:'从列头解析'};
  }
  if(nums.length===1){
    if(hasAbove)return {min:nums[0],max:null,valid:true,raw,note:'以上'};
    if(hasBelow)return {min:null,max:nums[0],valid:true,raw,note:'以下'};
    return {min:null,max:null,valid:false,raw,note:'单数字，边界不明确'};
  }
  return {min:null,max:null,valid:false,raw,note:'无数字'};
}

const mergeCache=new WeakMap();
function colToNum(letters){let n=0;for(const ch of letters.toUpperCase())n=n*26+(ch.charCodeAt(0)-64);return n;}
function numToCol(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
function getMergeResolver(sheet){
  let mr=mergeCache.get(sheet);if(mr)return mr;
  mr={masterOf:new Map(),rangeOf:new Map()};
  const merges=(sheet.model&&sheet.model.merges)||[];
  merges.forEach(range=>{
    const m=String(range).match(/^([A-Za-z]+)(\d+):([A-Za-z]+)(\d+)$/);if(!m)return;
    const c1=colToNum(m[1]),r1=parseInt(m[2],10),c2=colToNum(m[3]),r2=parseInt(m[4],10);
    const rg={r1,c1,r2,c2};mr.rangeOf.set(r1+':'+c1,rg);
    for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)mr.masterOf.set(r+':'+c,{row:r1,col:c1});
  });
  mergeCache.set(sheet,mr);return mr;
}
function resolveMaster(mr,r,c){
  const m=mr.masterOf.get(r+':'+c);return m?{row:m.row,col:m.col}:{row:r,col:c};
}

function convertWithSheetJS(data,note){
  const wbOld=XLSX.read(data,{type:'array',cellDates:true});
  const wb=new ExcelJS.Workbook();
  wbOld.SheetNames.forEach(name=>{
    const ws=wb.addWorksheet(name);
    const rows=XLSX.utils.sheet_to_json(wbOld.Sheets[name],{header:1,defval:null,raw:true});
    rows.forEach(r=>ws.addRow(r));
  });
  wb.__converted=true;wb.__note=note;return wb;
}
async function readWorkbook(file){
  const data=await file.arrayBuffer();
  if(!data||!data.byteLength)throw new Error('文件内容为空（0 字节）');
  if(/\.xls$/i.test(file.name)&&!/\.xlsx$/i.test(file.name)){
    return convertWithSheetJS(data,'.xls 旧格式，已用兼容模式读取（样式不保留，导出为 .xlsx）');
  }
  try{
    const wb=new ExcelJS.Workbook();
    await wb.xlsx.load(data);
    return wb;
  }catch(err){
    return convertWithSheetJS(data,'标准解析失败（'+(err&&err.message?err.message:err)+'），已用兼容模式读取');
  }
}
async function stripCF(buffer){
  const zip=await JSZip.loadAsync(buffer);
  const targets=[];
  zip.forEach((rel,entry)=>{if(/^xl\/worksheets\/sheet\d+\.xml$/.test(entry.name))targets.push(entry.name);});
  for(const name of targets){
    let xml=await zip.file(name).async('string');
    if(!/conditionalFormatting/.test(xml))continue;
    xml=xml.replace(/<conditionalFormatting\b[^>]*>[\s\S]*?<\/conditionalFormatting>/g,'');
    xml=xml.replace(/<x14:conditionalFormattings\b[^>]*>[\s\S]*?<\/x14:conditionalFormattings>/g,'');
    zip.file(name,xml);
  }
  return zip.generateAsync({type:'arraybuffer'});
}
function setFill(cell,argb){
  cell.style=Object.assign({},cell.style,{fill:{type:'pattern',pattern:'solid',fgColor:{argb}}});
}

/* ==================================================================
   二、集合匹配
   ================================================================== */
const KEY_SEP='\u0001';
function buildRowKey(sheet,mr,r,cols,headerRow){
  const raws=[];
  for(const c of cols){
    const p=resolveMaster(mr,r,c);
    if(p.row<r)return null;
    if(p.row<=headerRow){raws.push('');continue;}
    raws.push(getCellText(sheet.getRow(p.row).getCell(p.col)));
  }
  const norms=raws.map(t=>normalize(t));
  if(norms.every(t=>!t))return null;
  return {id:norms.join(KEY_SEP),label:raws.map(t=>String(t==null?'':t).trim()).join(' | ')};
}
const MAX_LOCS=1000;
function collectKeys(wb,cfgs){
  const map=new Map();
  wb.worksheets.forEach(sheet=>{
    const cfg=cfgs.get(sheet.name);if(!cfg)return;
    const {headerRow,cols}=cfg;
    const mr=getMergeResolver(sheet);
    const rowCount=sheet.rowCount||0;
    for(let r=headerRow+1;r<=rowCount;r++){
      const key=buildRowKey(sheet,mr,r,cols,headerRow);
      if(!key)continue;
      let e=map.get(key.id);
      if(!e){e={label:key.label,count:0,locs:[]};map.set(key.id,e);}
      e.count++;
      if(e.locs.length<MAX_LOCS)e.locs.push(sheet.name+'!R'+r);
    }
  });
  return map;
}
function diffOrders(mapA,mapB){
  const matched=[],onlyA=[],onlyB=[];
  for(const [id,ea] of mapA){
    const eb=mapB.get(id);
    if(eb)matched.push({id,label:ea.label||eb.label,countA:ea.count,countB:eb.count,locA:ea.locs,locB:eb.locs});
    else onlyA.push({id,label:ea.label,countA:ea.count,countB:0,locA:ea.locs,locB:[]});
  }
  for(const [id,eb] of mapB){
    if(!mapA.has(id))onlyB.push({id,label:eb.label,countA:0,countB:eb.count,locA:[],locB:eb.locs});
  }
  const cmp=(x,y)=>x.label.localeCompare(y.label,'zh-Hans-CN',{numeric:true});
  matched.sort(cmp);onlyA.sort(cmp);onlyB.sort(cmp);
  return {matched,onlyA,onlyB};
}
function hslToArgb(h,s,l){
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  let r,g,b;
  if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];
  const toHex=v=>Math.round((v+m)*255).toString(16).padStart(2,'0').toUpperCase();
  return 'FF'+toHex(r)+toHex(g)+toHex(b);
}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.codePointAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function buildColorMap(ids,mode,uniformHex){
  const cm=new Map();
  if(mode==='uniform'){
    const hex=(uniformHex||'#ffe08a').replace('#','').toUpperCase();
    const argb='FF'+hex;ids.forEach(id=>cm.set(id,argb));return cm;
  }
  ids.forEach(id=>{
    const h=hashStr(id);
    const hue=(h*137.508)%360,light=0.82-((h>>>9)%4)*0.08;
    cm.set(id,hslToArgb(hue,0.55,light));
  });
  return cm;
}
function highlightSet(wb,cfgs,colorMap){
  const details=[];
  wb.worksheets.forEach(sheet=>{
    const cfg=cfgs.get(sheet.name);if(!cfg)return;
    const {headerRow,cols}=cfg;
    const mr=getMergeResolver(sheet);
    const done=new Set();
    const paint=(rowIdx,colIdx,argb)=>{
      const mk=rowIdx+':'+colIdx;if(done.has(mk))return false;
      const rg=mr.rangeOf.get(mk);
      if(rg){
        for(let rr=rg.r1;rr<=rg.r2;rr++)for(let cc=rg.c1;cc<=rg.c2;cc++){
          const k=rr+':'+cc;if(done.has(k))continue;
          setFill(sheet.getRow(rr).getCell(cc),argb);done.add(k);
        }
      }else{setFill(sheet.getRow(rowIdx).getCell(colIdx),argb);done.add(mk);}
      return true;
    };
    const rowCount=sheet.rowCount||0;
    for(let r=headerRow+1;r<=rowCount;r++){
      const key=buildRowKey(sheet,mr,r,cols,headerRow);if(!key)continue;
      const argb=colorMap.get(key.id);if(!argb)continue;
      let painted=false;
      for(const c of cols){
        const p=resolveMaster(mr,r,c);if(p.row<=headerRow)continue;
        if(paint(p.row,p.col,argb))painted=true;
      }
      if(painted)details.push({sheetName:sheet.name,row:r,text:key.label});
    }
  });
  return details;
}
function appendSummarySet(wb,matched,label){
  let name='匹配汇总',n=2;
  while(wb.getWorksheet(name))name='匹配汇总_'+(n++);
  const ws=wb.addWorksheet(name);
  const isA=label==='文件A';
  ws.columns=[
    {header:'匹配键',key:'id',width:40},
    {header:label+'出现次数',key:'cnt',width:14},
    {header:label+'位置（Sheet!行号）',key:'loc',width:80},
  ];
  ws.getRow(1).font={bold:true};
  ws.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE8F3EF'}};
  matched.forEach(m=>{
    const locs=(isA?m.locA:m.locB)||[];
    const shown=locs.slice(0,30).join(', ')+(locs.length>30?' 等'+locs.length+'处':'');
    ws.addRow({id:m.label,cnt:isA?m.countA:m.countB,loc:shown});
  });
}

/* ==================================================================
   三、查值核对 / 填充
   ================================================================== */

/* 把主表展平成规则；每条规则：keys[] + value{raw,num,original} */
function buildRules(wb,cfgMap,shape){
  const rules=[];
  wb.worksheets.forEach(sheet=>{
    const c=cfgMap.get(sheet.name);if(!c||!c.enabled)return;
    const {headerRow}=c;if(headerRow==null)return;
    const mr=getMergeResolver(sheet);
    const rowCount=sheet.rowCount||0;

    if(shape==='matrix'){
      if(c.regionCol==null)return;
      const intervals=[];
      c.intervalCols.forEach((iv,col)=>{
        if(iv.valid&&(iv.min!=null||iv.max!=null))intervals.push({col,min:iv.min,max:iv.max,raw:iv.raw});
      });
      if(intervals.length===0)return;
      for(let r=headerRow+1;r<=rowCount;r++){
        const rp=resolveMaster(mr,r,c.regionCol);
        if(rp.row<r)continue;
        if(rp.row<=headerRow)continue;
        const regionRaw=getCellText(sheet.getRow(rp.row).getCell(rp.col));
        const regionNorm=normalize(regionRaw);
        if(!regionNorm)continue;
        for(const iv of intervals){
          const cp=resolveMaster(mr,r,iv.col);
          if(cp.row<=headerRow){
            rules.push({
              keys:[{value:regionNorm,raw:regionRaw,mode:'exact'},{value:[iv.min,iv.max],raw:iv.raw,mode:'range'}],
              value:{raw:'',num:null,original:null},
              source:{sheet:sheet.name,row:r},
              label:regionRaw+' | '+iv.raw
            });
            continue;
          }
          const vCell=sheet.getRow(cp.row).getCell(cp.col);
          const vRaw=getCellText(vCell);
          let original=vCell.value;
          if(original!==null&&original!==undefined&&typeof original==='object')original=vRaw;
          rules.push({
            keys:[{value:regionNorm,raw:regionRaw,mode:'exact'},{value:[iv.min,iv.max],raw:iv.raw,mode:'range'}],
            value:{raw:vRaw,num:extractNumber(vRaw),original},
            source:{sheet:sheet.name,row:r},
            label:regionRaw+' | '+iv.raw
          });
        }
      }
    }else{
      const keyCols=c.keyCols||[];
      if(keyCols.length===0||c.valueCol==null)return;
      for(let r=headerRow+1;r<=rowCount;r++){
        const kvs=[];let empty=true,skip=false;
        for(const kc of keyCols){
          if(kc.col==null){skip=true;break;}
          const p=resolveMaster(mr,r,kc.col);
          const v=(p.row<=headerRow)?'':getCellText(sheet.getRow(p.row).getCell(p.col));
          const norm=normalize(v);
          kvs.push({raw:v,norm,mode:kc.mode});
          if(norm)empty=false;
        }
        if(skip||empty)continue;
        const vp=resolveMaster(mr,r,c.valueCol);
        if(vp.row<=headerRow)continue;
        const vCell=sheet.getRow(vp.row).getCell(vp.col);
        const vRaw=getCellText(vCell);
        let original=vCell.value;
        if(original!==null&&original!==undefined&&typeof original==='object')original=vRaw;
        rules.push({
          keys:kvs.map(k=>({value:k.norm,raw:k.raw,mode:k.mode})),
          value:{raw:vRaw,num:extractNumber(vRaw),original},
          source:{sheet:sheet.name,row:r},
          label:kvs.map(k=>k.raw).join(' | ')
        });
      }
    }
  });
  return rules;
}

function matchOne(lookupVal,ruleKey){
  if(ruleKey.mode==='range'){
    const n=extractNumber(lookupVal);if(n===null)return false;
    const lo=ruleKey.value[0]===null?-Infinity:ruleKey.value[0];
    const hi=ruleKey.value[1]===null?Infinity:ruleKey.value[1];
    return n>=lo&&n<hi;
  }
  const lv=normalize(lookupVal);
  if(!lv)return false;
  const rv=ruleKey.value||'';
  if(ruleKey.mode==='exact')return lv===rv;
  if(ruleKey.mode==='prefix')return rv!==''&&lv.startsWith(rv);
  if(ruleKey.mode==='contains')return rv!==''&&lv.includes(rv);
  return false;
}
function findRule(rules,lookupKeys){
  for(const r of rules){
    if(r.keys.length!==lookupKeys.length)continue;
    let ok=true;
    for(let i=0;i<r.keys.length;i++){
      if(!matchOne(lookupKeys[i],r.keys[i])){ok=false;break;}
    }
    if(ok)return r;
  }
  return null;
}

/* 核心：逐行处理
   actionMode='fill'  → 把主表的值写入明细表的目标列
   actionMode='check' → 读明细表现有值，与主表值比对
*/
function processLookup(wbB,cfgB,rules,tolerance,actionMode){
  const results=[];
  wbB.worksheets.forEach(sheet=>{
    const c=cfgB.get(sheet.name);if(!c||!c.enabled)return;
    const {headerRow}=c;if(headerRow==null)return;
    const keyCols=(c.keyCols||[]).filter(x=>x!=null);
    if(keyCols.length===0||c.valueCol==null)return;
    const mr=getMergeResolver(sheet);
    const rowCount=sheet.rowCount||0;
    for(let r=headerRow+1;r<=rowCount;r++){
      // 收集键值（不跳过合并从属行，因为每行都是独立记录）
      const rawKeys=[];let empty=true;
      for(const col of keyCols){
        const p=resolveMaster(mr,r,col);
        const v=(p.row<=headerRow)?'':getCellText(sheet.getRow(p.row).getCell(p.col));
        rawKeys.push(v);
        if(v)empty=false;
      }
      // 核对模式才读目标列原值
      let bValRaw='',bNum=null;
      if(actionMode==='check'){
        const vp=resolveMaster(mr,r,c.valueCol);
        bValRaw=(vp.row<=headerRow)?'':getCellText(sheet.getRow(vp.row).getCell(vp.col));
        bNum=extractNumber(bValRaw);
        if(bValRaw)empty=false;
      }
      if(empty)continue;

      const res={
        sheetB:sheet.name,rowB:r,
        rawKeys,bValRaw,bNum,
        matchedLabel:'',aValRaw:'',aNum:null,
        status:'',diff:null,filled:false
      };

      const hit=findRule(rules,rawKeys);
      if(!hit){
        res.status='主表未找到';
      }else{
        res.matchedLabel=hit.label;
        res.aValRaw=hit.value.raw;
        res.aNum=hit.value.num;

        if(actionMode==='fill'){
          if(hit.value.raw===''||hit.value.original===null||hit.value.original===undefined){
            res.status='主表无值';
          }else{
            const vp=resolveMaster(mr,r,c.valueCol);
            const targetCell=sheet.getRow(vp.row).getCell(vp.col);
            const orig=hit.value.original;
            if(typeof orig==='number')targetCell.value=orig;
            else targetCell.value=hit.value.raw;
            res.status='已填充';
            res.filled=true;
          }
        }else{
          if(res.bNum===null){res.status='明细值非数值';}
          else if(res.aNum===null){res.status='主表值非数值';}
          else{
            const d=res.bNum-res.aNum;
            res.diff=d;
            res.status=Math.abs(d)<=tolerance?'一致':'不一致';
          }
        }
      }
      results.push(res);
    }
  });
  return results;
}

const C_GOOD='FFC6EFCE',C_BAD='FFFFC7CE',C_WARN='FFFFEB9C';
function highlightLookup(wb,results,cfgB,onMiss){
  const byKey=new Map();
  for(const r of results)byKey.set(r.sheetB+'!'+r.rowB,r);
  wb.worksheets.forEach(sheet=>{
    const c=cfgB.get(sheet.name);if(!c||!c.enabled)return;
    const {headerRow}=c;if(headerRow==null)return;
    const keyCols=(c.keyCols||[]).filter(x=>x!=null);
    if(keyCols.length===0||c.valueCol==null)return;
    const mr=getMergeResolver(sheet);
    for(let r=1;r<=(sheet.rowCount||0);r++){
      const res=byKey.get(sheet.name+'!'+r);if(!res)continue;
      let color;
      if(res.status==='一致'||res.status==='已填充')color=C_GOOD;
      else if(res.status==='不一致')color=C_BAD;
      else color=(onMiss==='skip'&&res.status!=='主表未找到'&&res.status!=='主表无值')?null:C_WARN;
      if(!color)continue;
      // 只高亮键列 + 目标列（整行的所有字段），让用户可以一眼看到填充位置
      for(const col of [...keyCols,c.valueCol]){
        const p=resolveMaster(mr,r,col);
        const rg=mr.rangeOf.get(p.row+':'+p.col);
        if(rg){
          for(let rr=rg.r1;rr<=rg.r2;rr++)for(let cc=rg.c1;cc<=rg.c2;cc++){
            setFill(sheet.getRow(rr).getCell(cc),color);
          }
        }else setFill(sheet.getRow(p.row).getCell(p.col),color);
      }
    }
  });
}

function appendSummaryLookup(wb,results,actionMode){
  let name=actionMode==='fill'?'填充汇总':'核对汇总',n=2;
  while(wb.getWorksheet(name))name=(actionMode==='fill'?'填充汇总_':'核对汇总_')+(n++);

      {header:'明细值',key:'bv',width:16},
      {header:'命中规则',key:'hit',width:36},

      {header:'结果',key:'st',width:14},
      {header:'差值',key:'diff',width:12}
    ];
    ws.getRow(1).font={bold:true};
    ws.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE8F3EF'}};
    for(const r of results){
      ws.addRow({
        s:r.sheetB,r:r.rowB,
        keys:r.rawKeys.join(' | '),
        bv:r.bNum===null?r.bValRaw:r.bNum,

        diff:r.diff===null?'':r.diff
      });
    }
  }
}

  renderConfigPanel();
});

document.getElementById('actionMode').addEventListener('change',e=>{

});

/* ==================================================================
   六、读文件
   ================================================================== */
async function readFiles(){
  const fa=document.getElementById('fileA').files[0];
  const fb=document.getElementById('fileB').files[0];
  if(!fa||!fb){alert('请先选择两个 Excel 文件');return;}
  const btn=document.getElementById('readBtn');
  btn.disabled=true;btn.textContent='读取中…';
  document.getElementById('log').innerHTML='';
  document.getElementById('configPanel').innerHTML='';
  document.getElementById('settingsPanel').style.display='none';
  document.getElementById('runBtn').disabled=true;
  document.getElementById('summary-wrap').className='';
  document.getElementById('stats').className='';
  document.getElementById('stats').innerHTML='';
  document.getElementById('dl-panel').style.display='none';
  document.getElementById('legend-panel').style.display='none';
  try{
    log('读取文件 A …');
    const wbA=await readWorkbook(fa);
    if(wbA.__converted)log('  '+wbA.__note);
    log('读取文件 B …');
    const wbB=await readWorkbook(fb);
    if(wbB.__converted)log('  '+wbB.__note);
    S.files={A:{wb:wbA,file:fa},B:{wb:wbB,file:fb}};
    initCfgs();
    renderConfigPanel();
    document.getElementById('settingsPanel').style.display='block';
    document.getElementById('runBtn').disabled=false;
    log('读取完成。请在下方配置面板中人工指定表头行、选择列。');
  }catch(err){
    console.error(err);
    log('读取失败：'+(err&&err.message?err.message:err));
    alert('读取失败，请查看日志。');
  }finally{
    btn.disabled=false;btn.textContent='读取文件并解析';
  }
}

function headerOptions(sheet,headerRow){
  const mr=getMergeResolver(sheet);

    const p=resolveMaster(mr,headerRow,c);
    const txt=getCellText(sheet.getRow(p.row).getCell(p.col)).trim();
    opts.push({col:c,text:txt});
  }
  return opts;

/* ==================================================================
   八、配置事件（全部用委托，动态元素通过父级读取 data-*）
   ================================================================== */
const cfgPanel=document.getElementById('configPanel');

/* ---------- change ---------- */
cfgPanel.addEventListener('change',e=>{
  const t=e.target;

  if(t.id==='shapeSelect'){onShapeChange(t.value);return;}

  const card=t.closest('.sheet-card');
  const ivItem=t.closest('.interval-item');

  // ---- 区间勾选框 ----
  if(t.classList.contains('iv-cb')&&ivItem){
    const sheetName=ivItem.dataset.sheet;
    const col=parseInt(ivItem.dataset.col,10);
    const cfg=S.lookupCfg.A.get(sheetName);if(!cfg)return;
    if(t.checked){
      const sheet=S.files.A.wb.getWorksheet(sheetName);
      const opts=headerOptions(sheet,cfg.headerRow);
      const o=opts.find(x=>x.col===col);
      const parsed=parseInterval(o?o.text:'');
      const existing=cfg.intervalCols.get(col);
      if(existing){parsed.min=existing.min;parsed.max=existing.max;parsed.valid=existing.valid;}
      cfg.intervalCols.set(col,parsed);
    }else{
      cfg.intervalCols.delete(col);
    }
    const iv=cfg.intervalCols.get(col);
    const minIn=ivItem.querySelector('.iv-min');
    const maxIn=ivItem.querySelector('.iv-max');
    const oldStatus=ivItem.querySelector('.iv-status');
    if(iv){
      ivItem.classList.add('on');
      if(iv.min!=null)minIn.value=iv.min;else minIn.value='';
      if(iv.max!=null)maxIn.value=iv.max;else maxIn.value='';
      const s=iv.valid?'<span class="iv-status ok">✓</span>':'<span class="iv-status bad">?</span>';
      if(oldStatus)oldStatus.outerHTML=s;
      else ivItem.querySelector('.iv-edit').insertAdjacentHTML('beforeend',s);
    }else{
      ivItem.classList.remove('on');
      if(oldStatus)oldStatus.outerHTML='';
    }
    return;
  }

  // ---- Sheet 启用 / 表头行 ----
  if(card){
    const side=card.dataset.side;
    const sheetName=card.dataset.sheet;
    if(t.classList.contains('sh-enable')){
      const cfg=(S.mode==='set'?S.setCfg:S.lookupCfg)[side].get(sheetName);if(!cfg)return;
      cfg.enabled=t.checked;
      card.classList.toggle('off',!t.checked);
      return;
    }
    if(t.classList.contains('sh-header')){
      const raw=String(t.value||'').trim();
      const v=parseInt(raw,10);
      const hdr=(raw===''||isNaN(v)||v<1)?null:Math.min(v,500);
      if(S.mode==='set'){
        const cfg=S.setCfg[side].get(sheetName);if(!cfg)return;
        cfg.headerRow=hdr;
        if(hdr==null){t.value='';cfg.cols=new Set();}else t.value=hdr;
        renderSetSelector(side);
      }else{
        const cfg=S.lookupCfg[side].get(sheetName);if(!cfg)return;
        cfg.headerRow=hdr;
        if(hdr==null){
          t.value='';
          if(side==='A'){cfg.regionCol=null;cfg.intervalCols=new Map();cfg.keyCols=[];cfg.valueCol=null;}
          else{cfg.keyCols=[];cfg.valueCol=null;}
        }else t.value=hdr;
        if(side==='A')renderLookupA();else renderLookupB();
      }
      return;
    }
  }

  // ---- 集合匹配：列勾选 ----
  if(t.classList.contains('col-cb')){
    const side=t.dataset.side,sheetName=t.dataset.sheet;
    const col=parseInt(t.dataset.col,10);
    const cfg=S.setCfg[side].get(sheetName);if(!cfg)return;
    if(t.checked)cfg.cols.add(col);else cfg.cols.delete(col);
    const chip=t.closest('.col-chip');
    if(chip)chip.classList.toggle('on',t.checked);
    const shCard=t.closest('.sheet-card');
    if(shCard){
      const cnt=shCard.querySelector('.sh-count');
      if(cnt)cnt.textContent='已选 '+cfg.cols.size+' 列';
    }
    return;
  }

  // ---- 查值核对 / 填充 ----
  if(t.classList.contains('region-col')){
    const cfg=S.lookupCfg.A.get(t.dataset.sheet);if(!cfg)return;
    cfg.regionCol=t.value===''?null:parseInt(t.value,10);
    cfg.intervalCols=new Map();
    renderLookupA();return;
  }
  if(t.classList.contains('key-col')){
    const cfg=S.lookupCfg.A.get(t.dataset.sheet);if(!cfg)return;
    const idx=parseInt(t.dataset.idx,10);
    if(!cfg.keyCols[idx])return;
    cfg.keyCols[idx].col=t.value===''?null:parseInt(t.value,10);
    return;
  }
  if(t.classList.contains('key-mode')){
    const cfg=S.lookupCfg.A.get(t.dataset.sheet);if(!cfg)return;
    const idx=parseInt(t.dataset.idx,10);
    if(!cfg.keyCols[idx])return;
    cfg.keyCols[idx].mode=t.value;return;
  }
  if(t.classList.contains('value-col')){
    const cfg=S.lookupCfg.A.get(t.dataset.sheet);if(!cfg)return;
    cfg.valueCol=t.value===''?null:parseInt(t.value,10);return;
  }
  if(t.classList.contains('b-key-col')){
    const cfg=S.lookupCfg.B.get(t.dataset.sheet);if(!cfg)return;
    const idx=parseInt(t.dataset.idx,10);
    cfg.keyCols[idx]=t.value===''?null:parseInt(t.value,10);return;
  }
  if(t.classList.contains('b-value-col')){
    const cfg=S.lookupCfg.B.get(t.dataset.sheet);if(!cfg)return;
    cfg.valueCol=t.value===''?null:parseInt(t.value,10);return;
  }
});

/* ---------- input：区间输入框实时保存 ---------- */
cfgPanel.addEventListener('input',e=>{
  const t=e.target;
  if(!t.classList.contains('iv-min')&&!t.classList.contains('iv-max'))return;
  const item=t.closest('.interval-item');if(!item)return;
  const sheetName=item.dataset.sheet;
  const col=parseInt(item.dataset.col,10);
  const cfg=S.lookupCfg.A.get(sheetName);if(!cfg)return;

  let iv=cfg.intervalCols.get(col);
  if(!iv){
    const sheet=S.files.A.wb.getWorksheet(sheetName);
    const opts=headerOptions(sheet,cfg.headerRow);
    const o=opts.find(x=>x.col===col);
    iv=parseInterval(o?o.text:'');
    cfg.intervalCols.set(col,iv);
    const cb=item.querySelector('.iv-cb');
    if(cb)cb.checked=true;
    item.classList.add('on');
  }
  const minS=String(item.querySelector('.iv-min').value||'').trim();
  const maxS=String(item.querySelector('.iv-max').value||'').trim();
  iv.min=minS===''?null:parseFloat(minS);
  iv.max=maxS===''?null:parseFloat(maxS);
  const minValid=minS===''||!isNaN(iv.min);
  const maxValid=maxS===''||!isNaN(iv.max);
  iv.valid=minValid&&maxValid&&(minS!==''||maxS!=='');
  const st=item.querySelector('.iv-status');
  const newSt=iv.valid?'<span class="iv-status ok">✓</span>':'<span class="iv-status bad">?</span>';
  if(st)st.outerHTML=newSt;
  else item.querySelector('.iv-edit').insertAdjacentHTML('beforeend',newSt);
});

/* ---------- click：全选/清空、增删键列 ---------- */
cfgPanel.addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn)return;
  const act=btn.dataset.act;

  if(act==='all'||act==='none'){
    const side=btn.dataset.side,sheetName=btn.dataset.sheet;
    const cfg=S.setCfg[side].get(sheetName);if(!cfg)return;
    if(cfg.headerRow==null){alert('请先填写表头行号');return;}
    const sheet=S.files[side].wb.getWorksheet(sheetName);
    const mr=getMergeResolver(sheet);
    const maxCol=Math.min(Math.max(sheet.columnCount||0,1),120);
    if(act==='all'){
      cfg.cols=new Set();
      for(let c=1;c<=maxCol;c++){
        const p=resolveMaster(mr,cfg.headerRow,c);
        if(getCellText(sheet.getRow(p.row).getCell(p.col)).trim())cfg.cols.add(c);
      }
      if(!cfg.cols.size)for(let c=1;c<=maxCol;c++)cfg.cols.add(c);
    }else cfg.cols=new Set();
    renderSetSelector(side);
    return;
  }

  if(act==='add-key'){
    const side=btn.dataset.side,sheetName=btn.dataset.sheet;
    if(side==='A'){
      const cfg=S.lookupCfg.A.get(sheetName);if(!cfg)return;
      cfg.keyCols.push({col:null,mode:'exact'});
      renderLookupA();
    }else{
      const cfg=S.lookupCfg.B.get(sheetName);if(!cfg)return;
      cfg.keyCols.push(null);
      renderLookupB();
    }
    return;
  }
  if(act==='del-key'){
    const side=btn.dataset.side,sheetName=btn.dataset.sheet;
    const idx=parseInt(btn.dataset.idx,10);
    if(side==='A'){
      const cfg=S.lookupCfg.A.get(sheetName);if(!cfg)return;
      cfg.keyCols.splice(idx,1);renderLookupA();
    }else{
      const cfg=S.lookupCfg.B.get(sheetName);if(!cfg)return;
      cfg.keyCols.splice(idx,1);renderLookupB();
    }
    return;
  }
});

/* ==================================================================
   九、执行
   ================================================================== */
async function process(){
  if(!S.files.A.wb||!S.files.B.wb){alert('请先读取文件');return;}
  if(S.mode==='set')await runSet();
  else await runLookup();
}

function resetOutputs(){
  document.getElementById('log').innerHTML='';
  document.getElementById('legend').innerHTML='';
  document.getElementById('downloads').innerHTML='';
  document.getElementById('stats').className='';
  document.getElementById('stats').innerHTML='';
  document.getElementById('summary-wrap').className='';
  document.getElementById('legend-panel').style.display='none';
  document.getElementById('dl-panel').style.display='none';
  S.results={set:{matched:[],onlyA:[],onlyB:[]},lookup:[]};
}

async function runSet(){
  const collect=side=>{
    const map=new Map(),missing=[];
    S.setCfg[side].forEach((cfg,name)=>{
      if(!cfg.enabled)return;
      if(cfg.headerRow==null){missing.push(name);return;}
      if(cfg.cols.size===0)return;
      map.set(name,{headerRow:cfg.headerRow,cols:[...cfg.cols].sort((a,b)=>a-b)});
    });
    return {map,missing};
  };
  const rA=collect('A'),rB=collect('B');
  if(rA.missing.length||rB.missing.length){
    let m='以下启用的 Sheet 未填写表头行号：\n';
    if(rA.missing.length)m+='文件A：'+rA.missing.join('、')+'\n';
    if(rB.missing.length)m+='文件B：'+rB.missing.join('、')+'\n';
    alert(m);return;
  }
  if(rA.map.size===0||rB.map.size===0){alert('请至少各勾选一个 Sheet 和一列');return;}

  resetOutputs();
  const btn=document.getElementById('runBtn');
  btn.disabled=true;btn.textContent='处理中…';
  try{
    log('模式：集合匹配');
    log('文件A：'+[...rA.map].map(([k,v])=>k+'[R'+v.headerRow+'; '+v.cols.map(numToCol).join('+')+']').join('，'));
    log('文件B：'+[...rB.map].map(([k,v])=>k+'[R'+v.headerRow+'; '+v.cols.map(numToCol).join('+')+']').join('，'));
    const mapA=collectKeys(S.files.A.wb,rA.map);
    log('文件A唯一键 '+mapA.size);
    const mapB=collectKeys(S.files.B.wb,rB.map);
    log('文件B唯一键 '+mapB.size);
    const {matched,onlyA,onlyB}=diffOrders(mapA,mapB);
    S.results.set={matched,onlyA,onlyB};
    log('匹配 '+matched.length+'；仅A '+onlyA.length+'；仅B '+onlyB.length);

    renderStatsSet(matched,onlyA,onlyB);

    const colorMode=document.getElementById('colorMode').value;
    const uniformColor=document.getElementById('uniformColor').value;
    const cm=buildColorMap(matched.map(m=>m.id),colorMode,uniformColor);
    renderLegendSet(matched,cm,colorMode);

    if(matched.length>0){
      log('高亮文件 A …');
      highlightSet(S.files.A.wb,rA.map,cm);
      log('高亮文件 B …');
      const dB=highlightSet(S.files.B.wb,rB.map,cm);
      document.getElementById('stCells').textContent=dB.length;
      log('共高亮 '+dB.length+' 行');
      appendSummarySet(S.files.A.wb,matched,'文件A');
      appendSummarySet(S.files.B.wb,matched,'文件B');
    }
    showSummary();
    setCsv('csvMain','匹配清单.csv',makeCsv(
      matched.map(m=>[m.label,m.countA,m.countB,locText(m.locA),locText(m.locB)]),
      ['匹配键','文件A次数','文件B次数','文件A位置','文件B位置']));
    setCsv('csvOnlyA','仅文件A有.csv',makeCsv(
      onlyA.map(m=>[m.label,m.countA,locText(m.locA)]),['匹配键','文件A次数','文件A位置']));
    setCsv('csvOnlyB','仅文件B有.csv',makeCsv(
      onlyB.map(m=>[m.label,m.countB,locText(m.locB)]),['匹配键','文件B次数','文件B位置']));

    document.getElementById('dlNote').innerHTML='文件 A、B 均已高亮，各自追加「匹配汇总」Sheet。';
    const dl=document.getElementById('downloads');dl.innerHTML='';
    mkDownload(dl,S.files.A.wb,S.files.A.file,'文件 A','（已高亮）','匹配高亮');
    mkDownload(dl,S.files.B.wb,S.files.B.file,'文件 B','（已高亮）','匹配高亮');
    document.getElementById('dl-panel').style.display='block';
    log('全部完成');
  }catch(err){
    console.error(err);log('错误：'+(err&&err.message?err.message:err));
    alert('处理失败，请查看日志。');
  }finally{
    btn.disabled=false;btn.textContent='开始处理';
  }
}

async function runLookup(){
  const missingA=[],missingB=[];
  S.lookupCfg.A.forEach((c,name)=>{
    if(!c.enabled)return;
    if(c.headerRow==null){missingA.push(name+'（缺表头行）');return;}
    if(S.shape==='matrix'){
      if(c.regionCol==null){missingA.push(name+'（缺行键列）');return;}
      const valid=[...c.intervalCols.values()].filter(iv=>iv.valid&&(iv.min!=null||iv.max!=null));
      if(valid.length===0){
        missingA.push(name+'（无有效区间列；已勾选 '+c.intervalCols.size+' 列'+(c.intervalCols.size?'但未解析或未手填':'')+'）');
        return;
      }
    }else{
      const keys=c.keyCols.filter(k=>k.col!=null);
      if(keys.length===0){missingA.push(name+'（未配置有效键列）');return;}
      if(c.valueCol==null){missingA.push(name+'（未选值列）');return;}
    }
  });
  S.lookupCfg.B.forEach((c,name)=>{
    if(!c.enabled)return;
    if(c.headerRow==null){missingB.push(name+'（缺表头行）');return;}
    const keys=c.keyCols.filter(x=>x!=null);
    if(keys.length===0){missingB.push(name+'（未配置有效键列）');return;}
    if(c.valueCol==null){missingB.push(name+'（未选'+(S.actionMode==='fill'?'目标列':'比对值列')+'）');return;}
  });
  if(missingA.length||missingB.length){
    let m='以下配置不完整：\n\n';
    if(missingA.length)m+='文件A（主表）：\n  '+missingA.join('\n  ')+'\n\n';
    if(missingB.length)m+='文件B（明细表）：\n  '+missingB.join('\n  ')+'\n';
    alert(m);return;
  }

  // 填充模式二次确认
  if(S.actionMode==='fill'){
    const ok=confirm('填充模式会覆盖明细表目标列的现有值，确定继续？');
    if(!ok)return;
  }

  resetOutputs();
  const btn=document.getElementById('runBtn');
  btn.disabled=true;btn.textContent='处理中…';
  try{
    log('模式：查值核对 · '+(S.actionMode==='fill'?'操作=填充':'操作=核对')+' · 主表形态='+(S.shape==='matrix'?'矩阵表':'规则表'));
    log('构建主表规则 …');
    const rules=buildRules(S.files.A.wb,S.lookupCfg.A,S.shape);
    log('主表共 '+rules.length+' 条规则');
    if(rules.length===0){alert('主表未生成任何规则，请检查配置');return;}

    const expectKeys=rules[0].keys.length;
    let mismatch=false;
    S.lookupCfg.B.forEach((c,name)=>{
      if(!c.enabled)return;
      const n=c.keyCols.filter(x=>x!=null).length;
      if(n!==expectKeys){
        log('<b>⚠ Sheet "'+name+'" 键列数（'+n+'）与主表（'+expectKeys+'）不一致，将无法匹配</b>');
        mismatch=true;
      }
    });
    if(mismatch){
      if(!confirm('有 Sheet 的键列数与主表不一致，可能永远匹配不到。是否继续？'))return;
    }

    const tolerance=parseFloat(document.getElementById('tolerance').value)||0;
    const onMiss=document.getElementById('onMiss').value;

    log('逐行处理明细表 …');
    const results=processLookup(S.files.B.wb,S.lookupCfg.B,rules,tolerance,S.actionMode);
    S.results.lookup=results;

    if(S.actionMode==='fill'){
      const filled=results.filter(r=>r.status==='已填充').length;
      const notFound=results.filter(r=>r.status==='主表未找到').length;
      const other=results.length-filled-notFound;
      log('填充完成：已填充 '+filled+'；未找到 '+notFound+'；其它 '+other+'；总计 '+results.length);
      renderStatsFill(filled,notFound,other,results.length);
    }else{
      const good=results.filter(r=>r.status==='一致').length;
      const bad=results.filter(r=>r.status==='不一致').length;
      const warn=results.length-good-bad;
      log('核对完成：一致 '+good+'；不一致 '+bad+'；异常 '+warn+'；总计 '+results.length);
      renderStatsCheck(good,bad,warn,results.length);
    }

    log('高亮明细表 …');
    highlightLookup(S.files.B.wb,results,S.lookupCfg.B,onMiss);
    if(results.length>0){
      appendSummaryLookup(S.files.B.wb,results,S.actionMode);
      log('已在文件 B 追加汇总 Sheet');
    }

    showSummary();
    if(S.actionMode==='fill'){
      setCsv('csvMain','填充明细.csv',makeCsv(
        results.map(r=>[r.sheetB,r.rowB,r.rawKeys.join(' | '),r.matchedLabel,r.aNum===null?r.aValRaw:r.aNum,r.status]),
        ['Sheet','行号','查找键','命中位置','填充值','状态']));
      setCsv('csvOnlyA','未填充明细.csv',makeCsv(
        results.filter(r=>r.status!=='已填充').map(r=>[r.sheetB,r.rowB,r.rawKeys.join(' | '),r.status]),
        ['Sheet','行号','查找键','状态']));
      setCsv('csvOnlyB','按状态汇总.csv',makeCsv(
        (()=>{
          const m=new Map();
          for(const r of results)m.set(r.status,(m.get(r.status)||0)+1);
          return [...m.entries()].map(([k,v])=>[k,v]);
        })(),
        ['状态','数量']));
    }else{
      setCsv('csvMain','核对明细.csv',makeCsv(
        results.map(r=>[r.sheetB,r.rowB,r.rawKeys.join(' | '),r.bNum===null?r.bValRaw:r.bNum,r.matchedLabel,r.aNum===null?r.aValRaw:r.aNum,r.status,r.diff===null?'':r.diff]),
        ['Sheet','行号','查找键','明细值','命中规则','主表值','结果','差值']));
      setCsv('csvOnlyA','不一致明细.csv',makeCsv(
        results.filter(r=>r.status==='不一致').map(r=>[r.sheetB,r.rowB,r.rawKeys.join(' | '),r.bNum,r.aNum,r.diff]),
        ['Sheet','行号','查找键','明细值','主表值','差值']));
      setCsv('csvOnlyB','异常明细.csv',makeCsv(
        results.filter(r=>r.status!=='一致'&&r.status!=='不一致').map(r=>[r.sheetB,r.rowB,r.rawKeys.join(' | '),r.bValRaw,r.status]),
        ['Sheet','行号','查找键','明细值','异常说明']));
    }

    document.getElementById('dlNote').innerHTML=
      '文件 A（主表）原样导出，仅清除条件格式。<br>'+
      '文件 B（明细表）'+(S.actionMode==='fill'?'已填入值':'已按核对结果高亮')+'，并追加汇总 Sheet。';
    const dl=document.getElementById('downloads');dl.innerHTML='';
    mkDownload(dl,S.files.A.wb,S.files.A.file,'文件 A','（主表）',S.actionMode==='fill'?'填充':'核对');
    mkDownload(dl,S.files.B.wb,S.files.B.file,'文件 B',S.actionMode==='fill'?'（已填充）':'（已高亮）',S.actionMode==='fill'?'填充':'核对');
    document.getElementById('dl-panel').style.display='block';
    log('全部完成');
  }catch(err){
    console.error(err);log('错误：'+(err&&err.message?err.message:err));
    alert('处理失败，请查看日志。');
  }finally{
    btn.disabled=false;btn.textContent='开始处理';
  }
}

function mkDownload(container,wb,file,tag,suffix,suffix2){
  const ext=wb.__converted?'.xlsx':(file.name.match(/\.xlsx?$/i)||['.xlsx'])[0];
  const base=file.name.replace(/\.xlsx?$/i,'');
  const a=document.createElement('a');
  a.href='#';a.textContent='下载 '+tag+suffix;
  container.appendChild(a);
  wb.xlsx.writeBuffer({useSharedStrings:false}).then(async buf=>{
    buf=await stripCF(buf);
    const url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.href=url;a.download=base+'_'+suffix2+(ext==='.xls'?'.xlsx':ext);
  });
}

function renderLegendSet(matched,cm,mode){
  const p=document.getElementById('legend-panel'),d=document.getElementById('legend');
  if(!cm.size){p.style.display='none';return;}
  p.style.display='block';
  let h='<b>'+(mode==='uniform'?'统一高亮色：':'颜色图例（'+cm.size+' 个键）：')+'</b><br>';
  let n=0;
  for(const m of matched){
    const a=cm.get(m.id);if(!a)continue;
    h+='<span class="legend-item"><span class="legend-swatch" style="background:#'+a.slice(2)+'"></span>'+esc(m.label)+'</span>';
    if(++n>=300){h+='<br>…共 '+cm.size+' 个';break;}
  }
  d.innerHTML=h;
}
function locText(a){if(!a||!a.length)return '';const s=a.slice(0,30).join(', ');return a.length>30?s+' 等'+a.length+'处':s;}

function showSummary(){
  document.getElementById('summary-wrap').className='on';
  renderSummaryTable();
}
function renderSummaryTable(){
  const head=document.getElementById('sumHead'),body=document.getElementById('sumBody');
  const filter=normalize(document.getElementById('sumFilter').value||'');
  const dir=gSortAsc?1:-1;

  if(S.mode==='set'){
    head.innerHTML='<tr>'+
      '<th onclick="sortSummary(\'label\')">匹配键 <span id="sk-label"></span></th>'+
      '<th onclick="sortSummary(\'countA\')">A 次数 <span id="sk-countA"></span></th>'+
      '<th onclick="sortSummary(\'countB\')">B 次数 <span id="sk-countB"></span></th>'+
      '<th>A 位置</th><th>B 位置</th></tr>';
    let rows=S.results.set.matched.filter(m=>!filter||normalize(m.label).includes(filter));
    rows=rows.slice().sort((a,b)=>{
      let r;
      if(gSortKey==='label')r=a.label.localeCompare(b.label,'zh-Hans-CN',{numeric:true});
      else r=(a[gSortKey]||0)-(b[gSortKey]||0);
      return r*dir||a.label.localeCompare(b.label,'zh-Hans-CN',{numeric:true});
    });
    ['label','countA','countB'].forEach(k=>{
      const el=document.getElementById('sk-'+k);
      if(el)el.textContent=k===gSortKey?(gSortAsc?'↑':'↓'):'';
    });
    const MAX=5000;let h='';
    for(let i=0;i<Math.min(rows.length,MAX);i++){
      const m=rows[i];
      h+='<tr><td class="id" title="'+esc(m.label)+'">'+esc(m.label)+'</td>'+
        '<td class="c">'+m.countA+'</td><td class="c">'+m.countB+'</td>'+
        '<td title="'+esc(locText(m.locA))+'">'+esc(locText(m.locA))+'</td>'+
        '<td title="'+esc(locText(m.locB))+'">'+esc(locText(m.locB))+'</td></tr>';
    }
    body.innerHTML=h;
    document.getElementById('sumCount').textContent='共 '+rows.length+' 个匹配键'+(rows.length>MAX?'（仅渲染前 '+MAX+' 行）':'');
  }else{
    const isFill=S.actionMode==='fill';
    if(isFill){
      head.innerHTML='<tr>'+
        '<th onclick="sortSummary(\'rowB\')">Sheet!行号 <span id="sk-rowB"></span></th>'+
        '<th>查找键</th>'+
        '<th>命中位置</th>'+
        '<th>填充值</th>'+
        '<th onclick="sortSummary(\'status\')">状态 <span id="sk-status"></span></th></tr>';
    }else{
      head.innerHTML='<tr>'+
        '<th onclick="sortSummary(\'rowB\')">Sheet!行号 <span id="sk-rowB"></span></th>'+
        '<th>查找键</th><th>明细值</th>'+
        '<th>命中规则</th><th>主表值</th>'+
        '<th onclick="sortSummary(\'status\')">结果 <span id="sk-status"></span></th>'+
        '<th>差值</th></tr>';
    }
    let rows=S.results.lookup.filter(r=>{
      if(!filter)return true;
      return normalize(r.rawKeys.join(' ')+' '+r.bValRaw+' '+r.status+' '+r.matchedLabel).includes(filter);
    });
    rows=rows.slice().sort((a,b)=>{
      let r;
      if(gSortKey==='status')r=String(a.status).localeCompare(String(b.status),'zh-Hans-CN');
      else if(gSortKey==='rowB')r=a.rowB-b.rowB;
      else r=0;
      return r*dir;
    });
    ['rowB','status'].forEach(k=>{
      const el=document.getElementById('sk-'+k);
      if(el)el.textContent=k===gSortKey?(gSortAsc?'↑':'↓'):'';
    });
    const MAX=5000;let h='';
    for(let i=0;i<Math.min(rows.length,MAX);i++){
      const m=rows[i];
      let cls='row-warn',sc='status-warn';
      if(m.status==='一致'||m.status==='已填充'){cls='row-good';sc='status-good';}
      else if(m.status==='不一致'){cls='row-bad';sc='status-bad';}
      if(isFill){
        h+='<tr class="'+cls+'">'+
          '<td>'+esc(m.sheetB)+'!R'+m.rowB+'</td>'+
          '<td title="'+esc(m.rawKeys.join(' | '))+'">'+esc(m.rawKeys.join(' | '))+'</td>'+
          '<td>'+esc(m.matchedLabel||'—')+'</td>'+
          '<td>'+(m.aNum===null?esc(m.aValRaw||'—'):m.aNum)+'</td>'+
          '<td class="'+sc+'">'+esc(m.status)+'</td></tr>';
      }else{
        h+='<tr class="'+cls+'">'+
          '<td>'+esc(m.sheetB)+'!R'+m.rowB+'</td>'+
          '<td title="'+esc(m.rawKeys.join(' | '))+'">'+esc(m.rawKeys.join(' | '))+'</td>'+
          '<td>'+esc(m.bValRaw)+'</td>'+
          '<td>'+esc(m.matchedLabel||'—')+'</td>'+
          '<td>'+(m.aNum===null?esc(m.aValRaw||'—'):m.aNum)+'</td>'+
          '<td class="'+sc+'">'+esc(m.status)+'</td>'+
          '<td>'+(m.diff===null?'—':(Math.round(m.diff*10000)/10000))+'</td></tr>';
      }
    }
    body.innerHTML=h;
    document.getElementById('sumCount').textContent='共 '+rows.length+' 条'+(rows.length>MAX?'（仅渲染前 '+MAX+' 行）':'');
  }
}
function sortSummary(k){
  if(gSortKey===k)gSortAsc=!gSortAsc;else{gSortKey=k;gSortAsc=true;}
  renderSummaryTable();
}

/* CSV */
function csvEsc(s){s=String(s==null?'':s);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function makeCsv(rows,heads){
  const lines=[heads.map(csvEsc).join(',')];
  rows.forEach(r=>lines.push(r.map(csvEsc).join(',')));
  return '\ufeff'+lines.join('\r\n');
}
function setCsv(elId,filename,text){
  const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
  const a=document.getElementById(elId);
  if(a.dataset.url)URL.revokeObjectURL(a.dataset.url);
  const url=URL.createObjectURL(blob);
  a.dataset.url=url;a.href=url;a.download=filename;
}

['fileA','fileB'].forEach(id=>{
  document.getElementById(id).addEventListener('change',()=>{
    document.getElementById('configPanel').innerHTML='';
    document.getElementById('settingsPanel').style.display='none';
    document.getElementById('runBtn').disabled=true;
    S.files={A:{wb:null,file:null},B:{wb:null,file:null}};
  });
});
document.getElementById('colorMode').addEventListener('change',e=>{
  document.getElementById('uniformColorRow').style.display=e.target.value==='uniform'?'flex':'none';
});
